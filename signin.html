<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in — Gridiron Edition</title>
<meta name="theme-color" content="#177b46">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4ef;color:#10291b;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:430px;margin:44px auto;padding:22px}header{text-align:center;color:#177b46;font-weight:900;margin-bottom:30px}
section{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 25px #1834231a}
h1{font-size:26px;margin:0 0 10px}p{color:#526359;line-height:1.45}
label{display:block;font-weight:700;font-size:14px;margin:20px 0 8px}
input{display:block;width:100%;padding:15px 12px;border:1px solid #abbeb1;border-radius:10px;font-size:17px;background:white;color:#122018;appearance:none;-webkit-appearance:none}
input:focus{outline:2px solid #177b46}button{width:100%;background:#177b46;color:white;border:0;border-radius:10px;padding:15px;font-size:17px;font-weight:800;margin-top:23px}
button:disabled{opacity:.6}#message{min-height:22px;margin:14px 0;color:#b42318}
a{color:#177b46;font-weight:700;text-decoration:none}.back{display:block;text-align:center;margin-top:20px}
</style></head><body><main>
<header>BLEACHER STATS · GRIDIRON EDITION</header>
<section><h1>Sign in</h1>
<p>Use your existing Gridiron account. Your saved games remain on this device.</p>
<form id="loginForm">
<label for="email">Email</label><input id="email" type="email" autocomplete="username" autocapitalize="none" inputmode="email" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<button type="submit" id="submit">Sign In</button>
<div id="message" role="status" aria-live="polite"></div>
</form></section>
<a class="back" href="./">Back to Gridiron</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const form=document.getElementById("loginForm"),message=document.getElementById("message"),button=document.getElementById("submit");
form.addEventListener("submit",async function(event){
 event.preventDefault();
 if(!window.supabase?.createClient){message.textContent="Sign-in service unavailable. Check your connection and try again.";return;}
 button.disabled=true;message.textContent="Signing in…";
 try{
   const client=window.supabase.createClient("https://eyuvgzhkhcpwtcbmsvct.supabase.co","sb_publishable_uMOkwO4jyHen4pz4zCkIuQ_Ss-wUf2l",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
   const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
   const result=await client.auth.signInWithPassword({email,password});
   if(result.error)throw result.error;
   message.style.color="#177b46";message.textContent="Signed in. Returning to Gridiron…";
   location.replace("./?signedIn=1");
 }catch(err){message.textContent=err?.message||"Could not sign in.";button.disabled=false;}
});
})();
</script>
</body></html>
