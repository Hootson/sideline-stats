name: Coach invite lightweight auth
on:
  push:
    paths:
      - '.github/coach-invite-lightweight-auth-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Add session-aware coach invite gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n'
          gate='''<script id="coachInviteSessionGate">\n(function(){\n  const token=new URLSearchParams(location.search).get('coachInvite')||'';\n  if(!token)return;\n  document.documentElement.style.visibility='hidden';\n  const goStart=()=>{const u=new URL('./start.html',location.href);u.searchParams.set('coachInvite',token);location.replace(u.href)};\n  try{\n    const gate=window.supabase.createClient('https://eyuvgzhkhcpwtcbmsvct.supabase.co','sb_publishable_uMOkwO4jyHen4pz4zCkIuQ_Ss-wUf2l',{auth:{persistSession:true,autoRefreshToken:false,detectSessionInUrl:true}});\n    gate.auth.getSession().then(({data})=>{if(data?.session){document.documentElement.style.visibility='';}else{goStart();}}).catch(goStart);\n  }catch(_){goStart();}\n})();\n</script>\n'''
          if 'id="coachInviteSessionGate"' in s:
              raise SystemExit('session-aware gate already present')
          if s.count(marker) != 1:
              raise SystemExit(f'expected exactly one Supabase marker, found {s.count(marker)}')
          before=len(s)
          s=s.replace(marker,marker+gate,1)
          required=['<main id="accountConfirmationPage"','<div class="app">','id="authModal"','id="createCoachInviteBtn"','<script src="./app.js?release=4.6.9"></script>']
          missing=[x for x in required if x not in s]
          if len(s)<=before or missing:
              raise SystemExit('integrity check failed: '+repr(missing))
          p.write_text(s)
          PY
      - name: Verify insertion and preserve app
        run: |
          git diff --check
          grep -q 'id="coachInviteSessionGate"' index.html
          grep -q '<main id="accountConfirmationPage"' index.html
          grep -q '<div class="app">' index.html
          grep -q 'id="authModal"' index.html
          grep -q 'id="createCoachInviteBtn"' index.html
          grep -q '<script src="./app.js?release=4.6.9"></script>' index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Route new coach invites through lightweight auth"
          git push origin gh-pages
