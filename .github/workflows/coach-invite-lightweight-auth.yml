name: Coach invite lightweight auth
on:
  push:
    paths:
      - '.github/coach-invite-lightweight-auth-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Fix authenticated coach invite handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          redirect='''<script>\n(function(){\n  const p=new URLSearchParams(location.search),token=p.get('coachInvite');\n  if(token){const u=new URL('./start.html',location.href);u.searchParams.set('coachInvite',token);location.replace(u.href)}\n})();\n</script>\n'''
          if redirect not in s:
              raise SystemExit('old unconditional coach redirect not found')
          s=s.replace(redirect,'',1)
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix authenticated coach invite handoff"
          git push origin gh-pages
