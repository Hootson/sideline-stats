name: Voice and field follow-up tests
on:
  push:
    branches: [fix/voice-playcall-scroll]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check voice-play.js
          node --check field-position.js
          node --check field-orientation.js
      - name: Regression tests
        run: node --test tests/*.test.cjs tests/gridiron-enhancements.test.js
