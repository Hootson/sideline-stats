name: Voice and Field Regression Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'voice-*.js'
      - 'field-*.js'
      - 'followup-loader.js'
      - 'voice-followup.css'
      - 'tests/voice-*.test.cjs'
      - 'tests/field-*.test.cjs'
      - 'tests/followup-assets.test.cjs'
      - '.github/workflows/voice-field-followup-test.yml'
  push:
    branches: [main]
    paths:
      - 'voice-*.js'
      - 'field-*.js'
      - 'followup-loader.js'
      - 'voice-followup.css'
      - 'tests/voice-*.test.cjs'
      - 'tests/field-*.test.cjs'
      - 'tests/followup-assets.test.cjs'
      - '.github/workflows/voice-field-followup-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check voice-play.js
          node --check voice-workflow.js
          node --check field-position.js
          node --check field-orientation.js
          node --check followup-loader.js
      - name: Run voice, field and follow-up regression tests
        run: node --test tests/voice-*.test.cjs tests/field-*.test.cjs tests/followup-assets.test.cjs
