name: Hardcourt Alpha Checks
on:
  pull_request:
    paths:
      - 'hardcourt/**'
      - 'tools/sideline-mcp/**'
      - '.github/workflows/hardcourt-alpha-checks.yml'
  push:
    branches:
      - 'build/hardcourt-alpha'
    paths:
      - 'hardcourt/**'
      - 'tools/sideline-mcp/**'
      - '.github/workflows/hardcourt-alpha-checks.yml'
jobs:
  hardcourt-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardcourt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build iPhone test artifact
        run: |
          rm -rf ../hardcourt-alpha-preview
          mkdir -p ../hardcourt-alpha-preview
          cp index.html styles.css app.js legacy-app.js engine.js ../hardcourt-alpha-preview/
          for file in account-flow.js account-integration.js cloud-account.js commercial-config.js account-flow.css; do
            if [ -f "$file" ]; then cp "$file" ../hardcourt-alpha-preview/; fi
          done
          if [ -d assets ]; then cp -R assets ../hardcourt-alpha-preview/; fi
      - name: Verify preview artifact dependencies
        run: |
          test -f ../hardcourt-alpha-preview/index.html
          test -f ../hardcourt-alpha-preview/app.js
          test -f ../hardcourt-alpha-preview/legacy-app.js
          test -f ../hardcourt-alpha-preview/engine.js
      - uses: actions/upload-artifact@v4
        with:
          name: hardcourt-alpha-preview
          path: hardcourt-alpha-preview
          retention-days: 7
  mcp-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/sideline-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
