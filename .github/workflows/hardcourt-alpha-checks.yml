name: Hardcourt Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'hardcourt/**'
      - 'tools/sideline-mcp/**'
      - '.github/workflows/hardcourt-alpha-checks.yml'
  push:
    branches: [main]
    paths:
      - 'hardcourt/**'
      - 'tools/sideline-mcp/**'
      - '.github/workflows/hardcourt-alpha-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardcourt-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardcourt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Hardcourt JavaScript syntax
        run: |
          node --check app.js
          node --check engine.js
          node --check service-worker.js
      - name: Run Hardcourt tests
        run: npm test

  mcp-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/sideline-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
