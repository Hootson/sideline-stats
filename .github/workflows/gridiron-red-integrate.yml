name: Integrate Gridiron red enhancements
on:
  workflow_dispatch:
  push:
    branches:
      - feature/gridiron-red-enhancements
    paths:
      - .github/gridiron-red-integrate-trigger.txt
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gridiron-red-enhancements
      - name: Apply safe integration patch
        run: python .github/gridiron-red-integrate.py
      - name: Run regression tests
        run: node tests/gridiron-enhancements.test.js
      - name: Verify browser scripts
        run: |
          grep -q 'field-orientation.js' index.html
          grep -q 'voice-workflow.js' index.html
          grep -q 'edit-play-model.js' index.html
          grep -q 'SidelineFieldOrientation' field-position.js
      - name: Commit integrated build
        run: |
          if git diff --quiet; then echo 'No integration changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html field-position.js service-worker.js
          git commit -m 'Integrate Gridiron red enhancement modules'
          git push origin HEAD:feature/gridiron-red-enhancements
