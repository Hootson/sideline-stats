wer"}\nfunction isCloudStatkeeper(){return cloudDeviceRole()==="statkeeper"}\n'), ('    const {data}=await SB.auth.getSession(); cloudUser=data?.session?.user||null; cloudReady=true; if(cloudUser)rebaseCloudHashesV443(); updateCloudUI();scheduleCloudSync(300);setTimeout(startCloudRealtime,800);\n    SB.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;if(cloudUser)rebaseCloudHashesV443();updateCloudUI();scheduleCloudSync(250);setTimeout(startCloudRealtime,800)});\n', '    const {data}=await SB.auth.getSession(); cloudUser=data?.session?.user||null; cloudReady=true; if(cloudUser)rebaseCloudHashesV443(); inferCloudDeviceRole();updateCloudUI();if(isCloudStatkeeper())scheduleCloudSync(300);else setTimeout(checkCloudForUpdates,500);setTimeout(startCloudRealtime,800);\n    SB.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;if(cloudUser)rebaseCloudHashesV443();inferCloudDeviceRole();updateCloudUI();if(isCloudStatkeeper())scheduleCloudSync(250);else setTimeout(checkCloudForUpdates,500);setTimeout(startCloudRealtime,800)});\n'), ('  const {data,error}=await SB.from("teams").select("id,name,grade,primary_color,accent_color,timezone,created_at,updated_at").order("created_at",{ascending:true});if(error)throw error;if(!data?.length)throw new Error("No cloud teams found for this account");if(data.length===1)return data[0];\n', '  const {data,error}=await SB.from("teams").select("id,name,grade,primary_color,accent_color,logo_data,timezone,created_at,updated_at").order("created_at",{ascending:true});if(error)throw error;if(!data?.length)throw new Error("No cloud teams found for this account");if(data.length===1)return data[0];\n'), ('    if(!team&&refreshing&&S.cloud?.teamId){const q=await SB.from("teams").select("id,name,grade,primary_color,accent_color,timezone,created_at,updated_at").eq("id",S.cloud.teamId).single();if(q.error)throw q.error;team=q.data}\n', '    if(!team&&refreshing&&S.cloud?.teamId){const q=await SB.from("teams").select("id,name,grade,primary_color,accent_color,logo_data,timezone,created_at,updated_at").eq("id",S.cloud.teamId).single();if(q.error)throw q.error;team=q.data}\n'), ('    const localGames=games.map(g=>{const gp=plays.filter(x=>x.game_id===g.id).sort((a,b)=>a.sequence-b.sequence).map(r=>restorePlayFromCloud(r,credits.filter(c=>c.play_id===r.id&&c.metadata?.active!==false),penalties.find(q=>q.play_id===r.id)));const sr=snaps.filter(x=>x.game_id===g.id).sort((a,b)=>a.snap_number-b.snap_number).map(x=>({id:x.id,ts:x.client_created_at?Date.parse(x.client_created_at):Date.parse(x.created_at),quarter:Number(x.quarter||1),playerIds:snapParts.filter(q=>q.snap_event_id===x.id).map(q=>q.player_id)}));const auto=gp.reduce((sum,p)=>sum+pointsFromPlay(p),0);const firstBefore=gp[0]?.stateBefore;return {id:g.id,opponent:g.opponent_name||"Opponent",opponentLogoData:null,week:Number(g.week_number||1),date:`Week ${Number(g.week_number||1)}`,location:g.location_type||"home",gameType:g.game_type||"regular",status:g.status==="final"?"complete":(g.status||"live"),ourScore:Number(g.team_score||0),scoreAdjustment:Number(g.team_score||0)-auto,scoreModelVersion:2,oppScore:Number(g.opponent_score||0),openingKickoff:g.opening_kickoff||"receive",initialPossession:firstBefore?.possession||((g.opening_kickoff||"receive")==="kick"?"opp":"ours"),initialDown:1,initialDistance:10,down:Number(g.current_down||1),distance:Number(g.current_distance||10),possession:localPossession(g.possession||"ours"),quarter:Number(g.current_quarter||1),plays:gp,snapRecords:sr};});\n    const cloud={teamId:team.id,seasonId:season.id,playerIds:Object.fromEntries(players.map(x=>[x.id,x.id])),gameIds:Object.fromEntries(games.map(x=>[x.id,x.id])),playIds:Object.fromEntries(plays.map(x=>[x.id,x.id])),playHashes:{},gameHashes:{},creditIds:{},creditHashes:{},penaltyIds:{},penaltyHashes:{},snapIds:Object.fromEntries(snaps.map(x=>[x.id,x.id])),snapHashes:{},connectedAt:new Date().toISOString(),lastSyncAt:new Date().toISOString(),lastSyncError:null,remoteFingerprint:fingerprintLoadedCloudSnapshot(team,players,games,plays,credits,penalties,snaps,snapParts),hashVersion:2};\n    S={team:{name:team.name,grade:team.grade||"5th Grade",season:season.name||String(season.season_year||"Season"),primary:team.primary_color||"#177b46",secondary:team.accent_color||"#f0b33b",logoData:null},roster,games:localGames,activeGameId:(refreshing&&priorActiveCloudId&&localGames.some(x=>x.id===priorActiveCloudId))?priorActiveCloudId:null,flow:{},editingPlayId:null,cloud};\n', '    const localGames=games.map(g=>{const gp=plays.filter(x=>x.game_id===g.id).sort((a,b)=>a.sequence-b.sequence).map(r=>restorePlayFromCloud(r,credits.filter(c=>c.play_id===r.id&&c.metadata?.active!==false),penalties.find(q=>q.play_id===r.id)));const sr=snaps.filter(x=>x.game_id===g.id).sort((a,b)=>a.snap_number-b.snap_number).map(x=>({id:x.id,ts:x.client_created_at?Date.parse(x.client_created_at):Date.parse(x.created_at),quarter:Number(x.quarter||1),playerIds:snapParts.filter(q=>q.snap_event_id===x.id).map(q=>q.player_id)}));const auto=gp.reduce((sum,p)=>sum+pointsFromPlay(p),0);const firstBefore=gp[0]?.stateBefore;return {id:g.id,opponent:g.opponent_name||"Opponent",opponentLogoData:g.opponent_logo_data||null,week:Number(g.week_number||1),date:`Week ${Number(g.week_number||1)}`,location:g.location_type||"home",gameType:g.game_type||"regular",status:g.status==="final"?"complete":(g.status||"live"),ourScore:Number(g.team_score||0),scoreAdjustment:Number(g.team_score||0)-auto,scoreModelVersion:2,oppScore:Number(g.opponent_score||0),openingKickoff:g.opening_kickoff||"receive",initialPossession:firstBefore?.possession||((g.opening_kickoff||"receive")==="kick"?"opp":"ours"),initialDown:1,initialDistance:10,down:Number(g.current_down||1),distance:Number(g.current_distance||10),possession:localPossession(g.possession||"ours"),quarter:Number(g.current_quarter||1),plays:gp,snapRecords:sr};});\n    const cloud={teamId:team.id,seasonId:season.id,playerIds:Object.fromEntries(players.map(x=>[x.id,x.id])),gameIds:Object.fromEntries(games.map(x=>[x.id,x.id])),playIds:Object.fromEntries(plays.map(x=>[x.id,x.id])),playHashes:{},gameHashes:{},creditIds:{},creditHashes:{},penaltyIds:{},penaltyHashes:{},snapIds:Object.fromEntries(snaps.map(x=>[x.id,x.id])),snapHashes:{},connectedAt:new Date().toISOString(),lastSyncAt:new Date().toISOString(),lastSyncError:null,remoteFingerprint:fingerprintLoadedCloudSnapshot(team,players,games,plays,credits,penalties,snaps,snapParts),hashVersion:2,deviceRole:"viewer"};\n    S={team:{name:team.name,grade:team.grade||"5th Grade",season:season.name||String(season.season_year||"Season"),primary:team.primary_color||"#177b46",secondary:team.accent_color||"#f0b33b",logoData:team.logo_data||null},roster,games:localGames,activeGameId:(refreshing&&priorActiveCloudId&&localGames.some(x=>x.id===priorActiveCloudId))?priorActiveCloudId:null,flow:{},editingPlayId:null,cloud};\n'), ('    if(!autoRefresh)scheduleCloudSync(1000);\n', '    // Cloud-loaded devices are viewers; never push a restored snapshot back to the database.\n'), ('      const {data,error}=await SB.from("teams").insert({owner_user_id:cloudUser.id,name:S.team.name,grade:S.team.grade||null,primary_color:S.team.primary||null,accent_color:S.team.secondary||null,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC"}).select("id").single();\n', '      const {data,error}=await SB.from("teams").insert({owner_user_id:cloudUser.id,name:S.team.name,grade:S.team.grade||null,primary_color:S.team.primary||null,accent_color:S.team.secondary||null,logo_data:S.team.logoData||null,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC"}).select("id").single();\n'), ('      const {error}=await SB.from("teams").update({name:S.team.name,grade:S.team.grade||null,primary_color:S.team.primary||null,accent_color:S.team.secondary||null}).eq("id",teamId); if(error)throw error;\n', '      const {error}=await SB.from("teams").update({name:S.team.name,grade:S.team.grade||null,primary_color:S.team.primary||null,accent_color:S.team.secondary||null,logo_data:S.team.logoData||null}).eq("id",teamId); if(error)throw error;\n'), ('    S.cloud={...(S.cloud||{}),teamId,seasonId,playerIds,gameIds:S.cloud?.gameIds||{},playIds:S.cloud?.playIds||{},playHashes:S.cloud?.playHashes||{},gameHashes:S.cloud?.gameHashes||{},creditIds:S.cloud?.creditIds||{},creditHashes:S.cloud?.creditHashes||{},penaltyIds:S.cloud?.penaltyIds||{},penaltyHashes:S.cloud?.penaltyHashes||{},snapIds:S.cloud?.snapIds||{},snapHashes:S.cloud?.snapHashes||{},connectedAt:new Date().toISOString(),lastSyncError:null,remoteFingerprint:S.cloud?.remoteFingerprint||null,hashVersion:2};persist();updateCloudUI();toast("Team connected — games will sync automatically")\n', '    S.cloud={...(S.cloud||{}),teamId,seasonId,playerIds,gameIds:S.cloud?.gameIds||{},playIds:S.cloud?.playIds||{},playHashes:S.cloud?.playHashes||{},gameHashes:S.cloud?.gameHashes||{},creditIds:S.cloud?.creditIds||{},creditHashes:S.cloud?.creditHashes||{},penaltyIds:S.cloud?.penaltyIds||{},penaltyHashes:S.cloud?.penaltyHashes||{},snapIds:S.cloud?.snapIds||{},snapHashes:S.cloud?.snapHashes||{},connectedAt:new Date().toISOString(),lastSyncError:null,remoteFingerprint:S.cloud?.remoteFingerprint||null,hashVersion:2,deviceRole:"statkeeper"};persist();updateCloudUI();toast("Team connected — this device is the statkeeper")\n'), ('', '  if(!isCloudStatkeeper())return;\n'), ('  return {season_id:S.cloud.seasonId,created_by:cloudUser.id,opponent_name:g.opponent||"Opponent",week_number:Number(g.week||1),game_date:null,location_type:cloudLocation(g.location),game_type:["regular","playoff","scrimmage","other"].includes(g.gameType)?g.gameType:"regular",status:cloudGameStatus(g),opening_kickoff:g.openingKickoff||null,current_quarter:Number(g.quarter||1),team_score:Math.max(0,Number(displayedOurScore(g)||0)),opponent_score:Math.max(0,Number(g.oppScore||0)),possession:g.possession==="opp"?"opponent":"ours",current_down:Number(g.down||1),current_distance:Number(g.distance||10),current_state:{quarter:Number(g.quarter||1),team_score:Math.max(0,Number(displayedOurScore(g)||0)),opponent_score:Math.max(0,Number(g.oppScore||0)),possession:g.possession==="opp"?"opponent":"ours",down:Number(g.down||1),distance:Number(g.distance||10)}};\n', '  return {season_id:S.cloud.seasonId,created_by:cloudUser.id,opponent_name:g.opponent||"Opponent",opponent_logo_data:g.opponentLogoData||null,week_number:Number(g.week||1),game_date:null,location_type:cloudLocation(g.location),game_type:["regular","playoff","scrimmage","other"].includes(g.gameType)?g.gameType:"regular",status:cloudGameStatus(g),opening_kickoff:g.openingKickoff||null,current_quarter:Number(g.quarter||1),team_score:Math.max(0,Number(displayedOurScore(g)||0)),opponent_score:Math.max(0,Number(g.oppScore||0)),possession:g.possession==="opp"?"opponent":"ours",current_down:Number(g.down||1),current_distance:Number(g.distance||10),current_state:{quarter:Number(g.quarter||1),team_score:Math.max(0,Number(displayedOurScore(g)||0)),opponent_score:Math.max(0,Number(g.oppScore||0)),possession:g.possession==="opp"?"opponent":"ours",down:Number(g.down||1),distance:Number(g.distance||10)}};\n'), ('  if(cloudSyncRunning||!SB||!cloudUser||!cloudLinked()||navigator.onLine===false)return;\n', '  if(cloudSyncRunning||!SB||!cloudUser||!cloudLinked()||navigator.onLine===false||!isCloudStatkeeper())return;\n'), ('    S.cloud.lastSyncAt=new Date().toISOString();S.cloud.lastSyncError=null;S.cloud.remoteFingerprint=null;persist({skipCloud:true});setTimeout(checkCloudForUpdates,500);\n', '    S.cloud.lastSyncAt=new Date().toISOString();S.cloud.lastSyncError=null;\n    try{S.cloud.remoteFingerprint=await remoteCloudFingerprint()}catch(_){S.cloud.remoteFingerprint=null}\n    persist({skipCloud:true});setTimeout(checkCloudForUpdates,500);\n'), ('window.addEventListener("online",()=>{scheduleCloudSync(150);setTimeout(checkCloudForUpdates,1200)});\ndocument.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){scheduleCloudSync(250);setTimeout(checkCloudForUpdates,1200)}});\n', 'window.addEventListener("online",()=>{if(isCloudStatkeeper())scheduleCloudSync(150);setTimeout(checkCloudForUpdates,500)});\ndocument.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(isCloudStatkeeper())scheduleCloudSync(250);setTimeout(checkCloudForUpdates,500)}});\n')]
          p=Path("index.html")
          s=p.read_text()
          for old,new in REPLACEMENTS:
              if old:
                  if old not in s:
                      raise SystemExit("Expected V4.4.6 source block not found")
                  s=s.replace(old,new,1)
              else:
                  if new.startswith('if(S.cloud.deviceRole'):
                      anchor='if(S.cloud.remoteFingerprint===undefined)S.cloud.remoteFingerprint=null;\n'
                      s=s.replace(anchor,anchor+new,1)
                  elif new.startswith('\n\nfunction inferCloudDeviceRole'):
                      anchor='}\n\n\nlet cloudRealtimeChannel=null,cloudRealtimeTimer=null;'
                      s=s.replace(anchor,'}'+new+'\nlet cloudRealtimeChannel=null,cloudRealtimeTimer=null;',1)
                  elif new.startswith('  if(!isCloudStatkeeper())return;'):
                      anchor='function scheduleCloudSync(delay=700){\n'
                      s=s.replace(anchor,anchor+new,1)
          style_start=s.index('<style>')
          style_close=s.index('</style>',style_start)
          css=s[style_start+7:style_close].strip()+"\n"
          s=s[:style_start]+'<link rel="stylesheet" href="./styles.css">'+s[style_close+8:]
          main_tag=s.index('<script>\n(function(){')
          main_close=s.index('</script>',main_tag)
          app=s[main_tag+8:main_close].strip()+"\n"
          s=s[:main_tag]+'<script src="./app.js"></script>'+s[main_close+9:]
          sw_tag=s.index('<script>',s.index('<script src="./app.js"></script>')+1)
          sw_close=s.index('</script>',sw_tag)
          pwa=s[sw_tag+8:sw_close].strip()+"\n"
          s=s[:sw_tag]+'<script src="./pwa.js"></script>'+s[sw_close+9:]
          Path('index.html').write_text(s)
          Path('styles.css').write_text(css)
          Path('app.js').write_text(app)
          Path('pwa.js').write_text(pwa)
          import re
          sw=Path('service-worker.js').read_text()
          sw=re.sub(r"const CACHE='[^']+';","const CACHE='sideline-stats-v4-4-7-modular';",sw,1)
          assets="const ASSETS=['./','./index.html','./styles.css','./app.js','./pwa.js','./brand-header.png','./brand-field.png','./icon.png'];"
          sw=re.sub(r"const ASSETS=\[[^;]+;",assets,sw,1)
          Path('service-worker.js').write_text(sw)
          PY
          python /tmp/modularize.py
          node --check app.js
          node --check pwa.js
      - name: Commit modular build
        shell: bash
        run: |
          git config user.name "Sideline Stats Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html styles.css app.js pwa.js service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Modularize V4.4.7 and isolate viewer sync"
          git push
