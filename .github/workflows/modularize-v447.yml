name: Modularize Sideline Stats V4.4.7
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/modularize-trigger.txt'
permissions:
  contents: write
jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upgrade to V4.4.7 and modularize
        shell: bash
        run: |
          cat > /tmp/modularize.py <<'PY'
