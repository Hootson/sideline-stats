name: Fix V4.6.67 iPhone runtime cache and dead controls
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/v467-ios-cache-runtime-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Align all iPhone/PWA runtime assets to V4.6.67
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # The restored page was still requesting 4.6.9 JS/CSS URLs, allowing iOS to execute stale runtime code.
          s=s.replace('release=4.6.9','release=4.6.67')
          p.write_text(s)

          p=Path('service-worker.js')
          s=p.read_text()
          s=s.replace("const RELEASE='4.6.48';","const RELEASE='4.6.67';",1)
          s=s.replace("const CACHE='bleacher-butt-gridiron-v4-6-48-player-photo-storage-hotfix-20261001';","const CACHE='bleacher-butt-gridiron-v4-6-67-ios-runtime-20261002';",1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html service-worker.js
          git commit -m 'Fix V4.6.67 iPhone stale runtime cache and controls'
          git push origin HEAD:gh-pages
