name: Set restored Gridiron V4.6.67 release label
on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/set-v467-release-label.yml']
permissions:
  contents: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Set release identity and bust iPhone cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('version.js')
          s=p.read_text()
          s=s.replace('window.SIDELINE_STATS_VERSION="4.6.42";','window.SIDELINE_STATS_VERSION="4.6.67";',1)
          p.write_text(s)
          p=Path('pwa.js')
          s=p.read_text()
          old='const SIDELINE_STATS_VERSION=window.SIDELINE_STATS_VERSION||"current";'
          new='window.SIDELINE_STATS_VERSION="4.6.67";\nconst SIDELINE_STATS_VERSION=window.SIDELINE_STATS_VERSION;'
          if old in s: s=s.replace(old,new,1)
          elif not s.startswith('window.SIDELINE_STATS_VERSION="4.6.67";'): s=new+'\n'+s
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add version.js pwa.js
          git commit -m 'Identify restored Gridiron baseline as V4.6.67 and refresh cache'
          git push origin HEAD:gh-pages
