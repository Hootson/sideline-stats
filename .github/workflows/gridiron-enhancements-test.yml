name: Gridiron Regression Checks

on:
  pull_request:
    branches: [main]
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'manifest.webmanifest'
      - 'supabase-*.sql'
      - 'tests/**'
      - '.github/workflows/gridiron-enhancements-test.yml'
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'manifest.webmanifest'
      - 'supabase-*.sql'
      - 'tests/**'
      - '.github/workflows/gridiron-enhancements-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gridiron-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production JavaScript syntax
        run: |
          for file in *.js; do
            node --check "$file"
          done
      - name: Run Gridiron regression suite
        run: node --test tests/*.test.cjs tests/gridiron-enhancements.test.js
