<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Hardcourt"><link rel="manifest" href="./manifest.webmanifest"><title>Bleacher Butt Stats — Hardcourt</title><link rel="stylesheet" href="./styles.css?v=20260920-ui8"></head><body><div id="app">
<section id="setup" class="setup"><div class="setup-brand"><img src="../brand-header.png" alt="Bleacher Butt Stats"><b>HARDCOURT EDITION</b></div><div class="setup-grid"><label>Our team<input id="teamName" value="Erie Elite"></label><label>Grade level<select id="gradeLevel"><option>5th Grade</option><option>6th Grade</option><option>7th Grade</option><option>8th Grade</option></select></label><label>Division<input id="division" placeholder="Optional"></label><label>Team logo<input id="teamLogo" type="file" accept="image/*"></label><label>Opponent<input id="oppName" value="Longmont" required></label><label>Game type<select id="gameType"><option value="regular">Regular Season</option><option value="playoffs">Playoffs</option></select></label><label>Opponent logo<input id="oppLogo" type="file" accept="image/*"></label><label>Periods<select id="periodMode"><option value="4">4 Quarters</option><option value="2">2 Halves</option></select></label><label>Minutes / period<input id="periodMinutes" type="number" value="8" min="1" max="30"></label><label>Starting offense<select id="startDirection"><option value="right">Attack right →</option><option value="left">← Attack left</option></select></label><label>Primary color<input id="primaryColor" type="color" value="#111111"></label><label>Accent color<input id="accentColor" type="color" value="#39a852"></label><label>Player foul limit<input id="foulLimit" type="number" value="5" min="1" max="10"></label><label>Bonus rule<select id="bonusRule"><option value="none">No automatic bonus</option><option value="oneone">1-and-1 at 7 / double at 10</option><option value="twoshots">2 shots at 5 per quarter</option></select></label><label>Timeout allocation<select id="timeoutMode"><option value="game">Per Game</option><option value="half">Per Half</option></select></label><label>Timeouts per allocation<input id="timeoutCount" type="number" value="3" min="0" max="10"></label><label>Overtime minutes<input id="otMinutes" type="number" value="3" min="1" max="10"></label></div><h2>Season Roster</h2><p>Select exactly five starters. Add a headshot once; it stays with the player on this device.</p><div id="setupRoster" class="setup-roster"></div><button id="startGame" class="primary">Start Game</button><p id="setupError" class="error"></p></section>
<section id="shell" class="hidden"><header class="scoreboard"><div class="score-team"><span id="homeLogo" class="score-logo"></span><strong id="homeLabel"></strong><b id="homeScore">0</b></div><div class="clockbox"><span id="periodLabel">Q1</span><span id="gameMeta" class="game-meta"></span><b id="clock">8:00</b><div class="clock-controls"><button id="startClock">Start</button><button id="stopClock">Stop</button></div></div><div class="score-team away"><b id="awayScore">0</b><strong id="awayLabel"></strong><span id="awayLogo" class="score-logo"></span></div></header>
<section id="gameView" class="view"><main id="court" class="court"><div class="half left"></div><div class="half right offense"></div><div class="midline"></div><div class="center-circle"></div><div class="paint left-paint"></div><div class="paint right-paint"></div><div class="rim left-rim"></div><div class="rim right-rim"></div><div class="arc left-arc"></div><div class="arc right-arc"></div><img class="court-brand-img" src="../brand-field.png" alt=""><aside id="teamControls" class="controls"><div class="active-court-five"><span id="activeTeamLabel"></span><div id="activeFive" class="players"></div></div><div class="control-group our-group"><span id="ourGroupLabel"></span><button id="turnoverBtn">Turnover</button><button id="stealBtn">Steal</button><button id="reboundBtn">Rebound</button><button id="blockBtn">Block</button><button id="undoBtn">Undo</button></div><div class="control-group opp-group"><span id="oppGroupLabel"></span><button id="opp2">+2</button><button id="opp3">+3</button><button id="oppReb">Rebound</button></div></aside><div id="offenseTools" class="offense-tools"><button id="foulBtn">Foul</button><button id="fastBtn">⚡ Fast Break</button></div><div id="gameManage" class="game-manage"><button id="subBtn">Sub</button><button id="timeoutBtn">Timeout</button><button id="editBtn">Edit</button><button id="nextPeriod">Next Period</button><button id="flipDirection">⇄</button></div><div id="shotPrompt" class="overlay hidden"></div></main><div id="recent" class="recent">Ready.</div></section>
<section id="rosterView" class="view hidden content"><div class="product-header"></div><h2>Roster & Team</h2><div id="rosterCards"></div></section>
<section id="timeView" class="view hidden content"><div class="product-header"></div><h2>Playing Time</h2><div id="timeCheck" class="time-warning hidden"></div><div id="timeTable"></div></section>
<section id="statsView" class="view hidden content"><div class="product-header"></div><h2>Stats</h2><div id="statsScope" class="seg"><button data-scope="game" class="active">Game</button><button data-scope="regular">Regular Season</button><button data-scope="playoffs">Playoffs</button><button data-scope="season">Season Total</button></div><div class="table-wrap"><table><thead><tr><th>Player</th><th>MIN</th><th>PTS</th><th>FG</th><th>3PT</th><th>FT</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TO</th><th>PF</th><th>+/-</th></tr></thead><tbody id="statsBody"></tbody></table></div></section>
<section id="playerView" class="view hidden content"><div class="product-header"></div><button id="backStats" class="back-btn">← Back to Stats</button><div id="playerDetail"></div><div id="playerCourt" class="analytics-court player-court"></div></section>
<section id="analyticsView" class="view hidden content"><div class="product-header"></div><h2>Analytics</h2><article class="shooting-card"><div class="shooting-head"><h3>Shooting</h3><div class="shot-filters"><label>Player<select id="shotPlayerFilter"></select></label><label>Time<select id="shotTimeFilter"><option value="game">Full Game</option><option value="first">1st Half</option><option value="second">2nd Half</option></select></label><label>Period<select id="shotPeriodFilter"><option value="all">All</option></select></label><label>Shot<select id="shotTypeFilter"><option value="all">All Shots</option><option value="2">2PT</option><option value="3">3PT</option></select></label></div></div><div id="chartMode" class="seg chart-mode"><button data-chart="shots" class="active">Shots</button><button data-chart="heat">Heat Map</button><button data-chart="both">Both</button></div><p id="shootingSummary"></p><div id="analyticsCourt" class="analytics-court"></div><div class="heat-legend"><span>Cold</span><i></i><span>Hot</span><span class="dot-legend">● Make &nbsp; ● Miss</span></div><h3>By Zone</h3><div id="zoneTable" class="zone-table"></div></article><div class="analytics-grid"><article><h3>Fast Break</h3><p id="fastSummary"></p></article></div></section>
<nav><button data-tab="roster">Roster & Team</button><button class="active" data-tab="game">Game</button><button data-tab="time">Playing Time</button><button data-tab="stats">Stats</button><button data-tab="analytics">Analytics</button></nav></section>
<div id="modal" class="modal hidden"><div class="modal-card"><h2 id="modalTitle"></h2><div id="modalBody"></div><button id="modalClose">Cancel</button></div></div></div><script type="module" src="./app.js?v=20260920-ui8"></script></body></html>
