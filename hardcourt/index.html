<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>Bleacher Butt Stats — Hardcourt Alpha</title><link rel="stylesheet" href="./styles.css"></head>
<body>
<div id="app">
<section id="setup" class="setup">
  <h1>BLEACHER <span>STATS</span></h1><p class="edition">HARDCOURT EDITION · ALPHA</p>
  <div class="setup-grid">
    <label>Our team<input id="teamName" value="Erie Elite"></label>
    <label>Opponent<input id="oppName" value="Longmont"></label>
    <label>Periods<select id="periodMode"><option value="4">4 Quarters</option><option value="2">2 Halves</option></select></label>
    <label>Minutes / period<input id="periodMinutes" type="number" value="8" min="1" max="30"></label>
    <label>Primary color<input id="primaryColor" type="color" value="#111111"></label>
    <label>Accent color<input id="accentColor" type="color" value="#39a852"></label>
  </div>
  <h2>Roster</h2><p>Select exactly five starters. Edit names/numbers before starting.</p>
  <div id="setupRoster" class="setup-roster"></div>
  <button id="startGame" class="primary">Start Game</button><p id="setupError" class="error"></p>
</section>

<section id="game" class="game hidden">
<header class="scoreboard">
 <div><strong id="homeLabel">Erie Elite</strong><b id="homeScore">0</b></div>
 <div class="clockbox"><span id="periodLabel">Q1</span><button id="clock">8:00</button><small>tap clock to start/stop</small></div>
 <div><strong id="awayLabel">Longmont</strong><b id="awayScore">0</b></div>
</header>
<div class="game-body">
 <aside class="controls">
   <button id="subBtn">Substitution</button><button id="turnoverBtn">Turnover</button>
   <button id="stealBtn">Steal</button><button id="reboundBtn">Rebound</button>
   <button id="foulBtn">Foul</button><button id="timeoutBtn">Timeout</button>
   <button id="fastBtn">⚡ Fast Break</button><button id="undoBtn">Undo</button>
 </aside>
 <main id="court" class="court" aria-label="basketball court">
   <div class="half left"></div><div class="half right offense"></div><div class="midline"></div><div class="center-circle"></div>
   <div class="paint left-paint"></div><div class="paint right-paint"></div>
   <div class="rim left-rim"></div><div class="rim right-rim"></div>
   <div class="arc left-arc"></div><div class="arc right-arc"></div>
   <div class="court-brand">BLEACHER<br><span>STATS</span><small>HARDCOURT</small></div>
   <div id="shotPrompt" class="overlay hidden"></div>
 </main>
</div>
<div id="activeFive" class="players"></div>
<div id="recent" class="recent">Ready.</div>
<nav><button data-tab="roster">Roster & Team</button><button class="active" data-tab="game">Game</button><button data-tab="time">Playing Time</button><button data-tab="stats">Stats</button><button data-tab="analytics">Analytics</button></nav>
</section>

<div id="modal" class="modal hidden"><div class="modal-card"><h2 id="modalTitle"></h2><div id="modalBody"></div><button id="modalClose">Cancel</button></div></div>
</div>
<script type="module" src="./app.js"></script></body></html>
