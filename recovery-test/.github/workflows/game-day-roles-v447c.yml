name: Game-day roles V4.4.7c
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/game-day-roles-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply game-day roles patch
        run: python3 .github/game-day-roles-v447c.py
      - name: Package latest build
        run: |
          rm -f sideline-stats-latest.zip
          zip -9 sideline-stats-latest.zip index.html styles.css app.js pwa.js service-worker.js manifest.webmanifest snap-tracker.html snap-tracker.js brand-header.png brand-field.png icon.png README.md
      - name: Commit
        run: |
          git config user.name 'Sideline Stats Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html service-worker.js snap-tracker.html snap-tracker.js sideline-stats-latest.zip
          git diff --cached --quiet || git commit -m 'Add dedicated snap tracker game-day role'
          git push
