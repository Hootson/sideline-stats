name: Hardcourt Alpha Checks
on:
  pull_request:
    paths:
      - 'hardcourt/**'
      - 'tools/sideline-mcp/**'
  push:
    branches:
      - 'build/hardcourt-alpha'
    paths:
      - 'hardcourt/**'
      - 'tools/sideline-mcp/**'
jobs:
  hardcourt-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardcourt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build iPhone test artifact
        run: |
          mkdir -p ../hardcourt-alpha-preview
          cp index.html styles.css app.js engine.js ../hardcourt-alpha-preview/
      - uses: actions/upload-artifact@v4
        with:
          name: hardcourt-alpha-preview
          path: hardcourt-alpha-preview
          retention-days: 7
  mcp-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/sideline-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
