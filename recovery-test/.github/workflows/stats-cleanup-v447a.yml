name: Stats cleanup V4.4.7a
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/stats-cleanup-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/stats-cleanup-v447a.py
      - name: Package
        run: |
          rm -f sideline-stats-latest.zip
          zip -9 sideline-stats-latest.zip index.html styles.css app.js pwa.js service-worker.js manifest.webmanifest brand-header.png brand-field.png icon.png README.md
      - name: Commit
        run: |
          git config user.name 'Sideline Stats Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html service-worker.js sideline-stats-latest.zip
          git diff --cached --quiet || git commit -m 'Add fumbles drops and stat sorting'
          git push
