<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10231c">
<title>Start Your Team | Bleacher Butt Stats</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#07110d;color:#fff}body{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 0,#173f31 0,#07110d 48%,#020403 100%)}.shell{width:min(560px,100%)}.brand{text-align:center;margin-bottom:16px}.brand small{display:block;color:#93c8ac;font-size:10px;font-weight:900;letter-spacing:.2em;margin-bottom:5px}.brand strong{font-size:25px;letter-spacing:.03em}.card{background:#fff;color:#10231a;border-radius:20px;padding:24px;box-shadow:0 24px 80px #0008}.card h1{margin:0 0 6px;font-size:25px}.sub{margin:0 0 18px;color:#697870;font-size:13px;line-height:1.45}.sport{margin:0 0 16px;padding:11px 13px;border:1px solid #d7e1dc;border-radius:11px;background:#f5f9f6;font-size:12px;font-weight:850;color:#176c38}label{display:block;margin:13px 0;font-size:12px;font-weight:850}input{display:block;width:100%;margin-top:6px;padding:13px 14px;border:2px solid #d7e1dc;border-radius:11px;background:#fff;color:#10231a;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;outline:none;-webkit-appearance:none}input:focus{border-color:#58a97a;box-shadow:0 0 0 3px rgba(88,169,122,.14)}button{width:100%;min-height:48px;border-radius:11px;font-weight:900;font-size:14px;cursor:pointer}.primary{border:0;background:#07110d;color:#fff;margin-top:4px}.secondary{margin-top:9px;border:2px solid #d7e1dc;background:#fff;color:#07110d}.forgot{display:none;margin:10px auto 0;width:auto;min-height:0;padding:4px;border:0;background:transparent;color:#4d685a;text-decoration:underline;font-size:11px}.note{margin:14px 0 0;padding:10px;border:1px solid #d7e1dc;border-radius:10px;background:#f7faf8;color:#697870;text-align:center;font-size:11px;line-height:1.4}.msg{min-height:20px;margin-top:10px;text-align:center;color:#b42318;font-size:12px}.hidden{display:none!important}@media(max-width:600px){body{place-items:start center;padding:max(12px,env(safe-area-inset-top)) 10px 14px}.brand{margin:8px 0 12px}.brand strong{font-size:21px}.card{padding:18px;border-radius:17px}.card h1{font-size:22px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body>
<main class="shell">
<header class="brand"><small>WELCOME TO</small><strong>BLEACHER BUTT STATS</strong></header>
<section class="card">
<h1 id="heading">Start your team</h1>
<p class="sub" id="sub">Create your account, then we'll take you straight into Gridiron setup.</p>
<div class="sport">🏈 GRIDIRON EDITION • 7-DAY FREE TRIAL • NO CARD REQUIRED</div>
<form id="form">
<label>Email<input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" required></label>
<label>Password<input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="At least 6 characters" required></label>
<label id="confirmWrap">Confirm password<input id="confirm" type="password" minlength="6" autocomplete="new-password" placeholder="Re-enter password" required></label>
<button class="primary" id="submit" type="submit">Create Account & Continue</button>
<button class="secondary" id="switch" type="button">Already Have an Account? Sign In</button>
<button class="forgot" id="forgot" type="button">Forgot password?</button>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
</form>
<p class="note">Your Bleacher Butt Stats login works across editions. Your team data stays tied to your account.</p>
</section>
</main>
<script>
window.addEventListener('DOMContentLoaded',()=>{
 const SUPABASE_URL='https://eyuvgzhkhcpwtcbmsvct.supabase.co',SUPABASE_KEY='sb_publishable_uMOkwO4jyHen4pz4zCkIuQ_Ss-wUf2l';
 const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const $=id=>document.getElementById(id);let create=true;
 function setMode(next){create=next;$('heading').textContent=create?'Start your team':'Welcome back';$('sub').textContent=create?'Create your account, then we’ll take you straight into Gridiron setup.':'Sign in to continue to your Gridiron teams.';$('confirmWrap').classList.toggle('hidden',!create);$('confirm').required=create;$('password').autocomplete=create?'new-password':'current-password';$('submit').textContent=create?'Create Account & Continue':'Sign In & Continue';$('switch').textContent=create?'Already Have an Account? Sign In':'Need an Account? Create One';$('forgot').style.display=create?'none':'block';$('msg').textContent=''}
 $('switch').addEventListener('click',()=>setMode(!create));
 $('forgot').addEventListener('click',async()=>{const email=$('email').value.trim().toLowerCase();if(!email){$('msg').textContent='Enter your email above first.';return}location.href='./forgot-password.html?email='+encodeURIComponent(email)});
 $('form').addEventListener('submit',async e=>{e.preventDefault();const email=$('email').value.trim().toLowerCase(),password=$('password').value,confirm=$('confirm').value;if(create&&password!==confirm){$('msg').textContent='Passwords do not match.';return}$('submit').disabled=$('switch').disabled=true;$('msg').style.color='#697870';$('msg').textContent=create?'Creating your account…':'Signing you in…';const r=create?await sb.auth.signUp({email,password,options:{data:{bleacher_butt_account:true,product:'gridiron'}}}):await sb.auth.signInWithPassword({email,password});if(r.error){$('msg').style.color='#b42318';$('msg').textContent=r.error.message;$('submit').disabled=$('switch').disabled=false;return}if(create&&!r.data?.session){$('msg').style.color='#238c50';$('msg').textContent='Account created. Check your email to confirm it, then return here and sign in.';$('submit').disabled=$('switch').disabled=false;setMode(false);return}location.replace('./?start=gridiron')});
});
</script>
</body>
</html>
