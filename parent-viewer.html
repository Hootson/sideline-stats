<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sideline Stats Parent Viewer</title><meta name="theme-color" content="#f28c28">
<style>:root{--p:#f28c28;--a:#17202a;--p-ink:#111;--a-ink:#fff;--bg:#f5f5f3;--card:#fff;--ink:#17202a;--muted:#6f767d;--line:#e3e5e7}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:860px;margin:auto;padding:14px 12px 40px}.hero{min-height:104px;background:#071019;color:#fff;border-radius:18px;padding:10px 16px;border-bottom:6px solid var(--a);display:flex;align-items:center;gap:14px}.viewer-brand{width:min(46%,330px);max-height:84px;object-fit:contain}.eyebrow{font-size:11px;font-weight:900;color:#65b946}.hero h1{margin:4px 0 2px}.card{background:#fff;border-radius:16px;padding:14px;margin-top:12px;border:1px solid var(--line)}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.toolbar select{padding:10px;border:1px solid var(--line);border-radius:10px}.refresh{border:0;background:var(--a);color:#fff;border-radius:10px;padding:10px 12px;font-weight:900}.score{display:grid;grid-template-columns:1fr .8fr 1fr;align-items:center;gap:12px;text-align:center}.score-num{font-size:58px;font-weight:950}.team{font-weight:900}.status{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--a);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{text-align:center}.stat strong{display:block;font-size:24px;color:var(--p)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}.hidden{display:none}.notice{padding:12px;border-radius:12px;background:#fff6dd;margin-top:12px}.updated{text-align:center;color:var(--muted);font-size:11px;margin-top:10px}@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}.toolbar{flex-direction:column}.toolbar select,.refresh,.pc-launch{width:100%}}</style>
</head><body><div class="wrap"><section class="hero"><img class="viewer-brand" src="./brand-header-gridiron.webp"><div><div class="eyebrow">PARENT LIVE STATS</div><h1 id="teamName">Loading…</h1><div id="seasonName">Live team stats</div></div></section><div id="message" class="notice hidden"></div><section class="card toolbar"><select id="gameSelect"></select><button id="refreshBtn" class="refresh">Refresh</button></section><section class="card"><div class="score"><div><div class="team" id="ourTeam">Team</div><div class="score-num" id="ourScore">0</div></div><div><div>VS</div><span id="gameStatus" class="status">—</span></div><div><div class="team" id="oppTeam">Opponent</div><div class="score-num" id="oppScore">0</div></div></div><div id="gameMeta"></div></section><section class="card"><div class="grid"><div class="stat"><strong id="rushYds">0</strong>RUSH YDS</div><div class="stat"><strong id="passYds">0</strong>PASS YDS</div><div class="stat"><strong id="totalYds">0</strong>TOTAL YDS</div><div class="stat"><strong id="firstDowns">0</strong>1ST DOWNS</div></div></section><section class="card"><table><tbody id="rushBody"></tbody></table></section><section class="card"><table><tbody id="passBody"></tbody></table></section><section class="card"><table><tbody id="recBody"></tbody></table></section><section class="card"><table><tbody id="defBody"></tbody></table></section><div class="updated" id="updated"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./version.js?release=4.6.54"></script><script src="./parent-viewer.js?release=4.6.54"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="./player-card-back-master.js?release=4.6.54"></script><script src="./player-card-vintage-3.js?release=4.6.54"></script><script src="./player-card-front-align-pass1.js?release=4.6.54"></script><script src="./player-card-grid-debug.js?release=4.6.54"></script><script src="./card-analytics-loader.js?release=4.6.54"></script></body></html>
