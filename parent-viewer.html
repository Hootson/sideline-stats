<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sideline Stats Parent Viewer</title>
<meta name="theme-color" content="#f28c28">
<style>
:root{--p:#f28c28;--a:#17202a;--bg:#f5f5f3;--card:#fff;--ink:#17202a;--muted:#6f767d;--line:#e3e5e7}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:860px;margin:auto;padding:14px 12px 40px}.hero{background:var(--p);color:#111;border-radius:18px;padding:18px;box-shadow:0 5px 18px #0001}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em}.hero h1{margin:4px 0 2px;font-size:28px}.hero .sub{font-weight:700;opacity:.8}.card{background:var(--card);border-radius:16px;padding:14px;margin-top:12px;border:1px solid var(--line);box-shadow:0 2px 10px #0000000a}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}.team{font-weight:900}.score-num{font-size:52px;font-weight:950;line-height:1}.vs{font-size:12px;font-weight:900;color:var(--muted)}.meta{text-align:center;margin-top:10px;font-weight:800}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef1f2;font-size:12px;font-weight:900}.live{background:#fff0df;color:#9a4c00}.final{background:#eaf4ed;color:#1f6c3d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f7f8f8;border-radius:12px;padding:10px;text-align:center}.stat strong{display:block;font-size:24px}.stat span{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.05em}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between}.toolbar select{max-width:260px;padding:10px;border:1px solid var(--line);border-radius:10px;background:white;font-weight:800}.refresh{border:0;background:var(--a);color:white;border-radius:10px;padding:10px 12px;font-weight:900}.section-title{margin:0 0 8px;font-size:18px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{font-size:10px;color:var(--muted);letter-spacing:.04em}.notice{padding:12px;border-radius:12px;background:#fff6dd;border:1px solid #edd89a;margin-top:12px}.hidden{display:none}.updated{text-align:center;color:var(--muted);font-size:11px;margin-top:10px}.logo{width:54px;height:54px;border-radius:50%;object-fit:contain;background:#fff8;margin:0 auto 6px;display:block}.empty{color:var(--muted);font-size:13px}
@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}.score-num{font-size:44px}.hero h1{font-size:24px}.toolbar{align-items:stretch;flex-direction:column}.toolbar select,.refresh{width:100%;max-width:none}.table-wrap{overflow-x:auto}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero"><div class="eyebrow">SIDELINE STATS • PARENT VIEW</div><h1 id="teamName">Loading…</h1><div class="sub" id="seasonName">Live team stats</div></section>
  <div id="message" class="notice hidden"></div>
  <section class="card toolbar"><select id="gameSelect"></select><button id="refreshBtn" class="refresh">Refresh</button></section>
  <section class="card" id="scoreCard"><div class="score"><div><img id="teamLogo" class="logo hidden"><div class="team" id="ourTeam">Team</div><div class="score-num" id="ourScore">0</div></div><div><div class="vs">VS</div><span id="gameStatus" class="status">—</span></div><div><div class="team" id="oppTeam">Opponent</div><div class="score-num" id="oppScore">0</div></div></div><div class="meta" id="gameMeta">—</div></section>
  <section class="card"><h2 class="section-title">Team Stats</h2><div class="grid"><div class="stat"><strong id="rushYds">0</strong><span>RUSH YDS</span></div><div class="stat"><strong id="passYds">0</strong><span>PASS YDS</span></div><div class="stat"><strong id="totalYds">0</strong><span>TOTAL YDS</span></div><div class="stat"><strong id="firstDowns">0</strong><span>1ST DOWNS</span></div></div></section>
  <section class="card"><h2 class="section-title">Rushing</h2><div class="table-wrap"><table><thead><tr><th>Player</th><th>CAR</th><th>YDS</th><th>AVG</th><th>TD</th></tr></thead><tbody id="rushBody"></tbody></table></div></section>
  <section class="card"><h2 class="section-title">Passing</h2><div class="table-wrap"><table><thead><tr><th>Player</th><th>CMP/ATT</th><th>YDS</th><th>TD</th><th>INT</th></tr></thead><tbody id="passBody"></tbody></table></div></section>
  <section class="card"><h2 class="section-title">Receiving</h2><div class="table-wrap"><table><thead><tr><th>Player</th><th>REC</th><th>YDS</th><th>AVG</th><th>TD</th></tr></thead><tbody id="recBody"></tbody></table></div></section>
  <section class="card"><h2 class="section-title">Defense</h2><div class="table-wrap"><table><thead><tr><th>Player</th><th>TKL</th><th>TFL</th><th>SACK</th><th>INT</th></tr></thead><tbody id="defBody"></tbody></table></div></section>
  <div class="updated" id="updated"></div>
</div>
<script src="./parent-viewer.js"></script>
</body>
</html>
