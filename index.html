<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sideline Stats</title>
<meta name="theme-color" content="#177b46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sideline Stats">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="./styles.css?release=4.6.9">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const token=new URLSearchParams(location.search).get('coachInvite')||'';
  if(!token)return;
  document.documentElement.style.visibility='hidden';
  const SUPABASE_URL='https://eyuvgzhkhcpwtcbmsvct.supabase.co';
  const SUPABASE_KEY='sb_publishable_uMOkwO4jyHen4pz4zCkIuQ_Ss-wUf2l';
  try{
    const gate=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:false,detectSessionInUrl:true}});
    gate.auth.getSession().then(({data})=>{
      if(data?.session){document.documentElement.style.visibility='';return;}
      const u=new URL('./start.html',location.href);
      u.searchParams.set('coachInvite',token);
      location.replace(u.href);
    }).catch(()=>{
      const u=new URL('./start.html',location.href);
      u.searchParams.set('coachInvite',token);
      location.replace(u.href);
    });
  }catch(_){
    const u=new URL('./start.html',location.href);
    u.searchParams.set('coachInvite',token);
    location.replace(u.href);
  }
})();
</script>
</head>
<body>
<script>if(new URLSearchParams(location.search).get('accountConfirmed')==='1')document.body.classList.add('confirmation-mode')</script>
<!-- existing application markup continues unchanged -->
<script src="./app.js"></script>
</body>
</html>
